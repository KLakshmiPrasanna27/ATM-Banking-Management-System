
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Balance Enquiry</title>


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            font-family:
                "Segoe UI",
                Arial,
                sans-serif;

            background:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(59,130,246,0.18),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 80% 80%,
                    rgba(124,58,237,0.15),
                    transparent 30%
                ),
                #07111f;

            color: white;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 25px;
        }


        .balance-container {

            width: 100%;

            max-width: 620px;
        }


        .top-bar {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 18px;
        }


        .back-btn {

            border: 1px solid
                rgba(255,255,255,0.15);

            background:
                rgba(255,255,255,0.06);

            color: #dce7fa;

            padding: 9px 15px;

            border-radius: 9px;

            cursor: pointer;

            transition: 0.25s;
        }


        .back-btn:hover {

            background:
                rgba(59,130,246,0.18);

            color: white;
        }


        .logout-btn {

            border: none;

            background:
                rgba(239,68,68,0.12);

            color: #ffb4b4;

            padding: 9px 15px;

            border-radius: 9px;

            cursor: pointer;
        }


        .balance-card {

            background:
                rgba(255,255,255,0.97);

            color: #17233c;

            border-radius: 25px;

            padding: 38px;

            box-shadow:
                0 25px 60px
                rgba(0,0,0,0.35);
        }


        .icon {

            width: 65px;

            height: 65px;

            border-radius: 18px;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 30px;

            background: #dbeafe;

            color: #2563eb;

            margin-bottom: 20px;
        }


        .small-title {

            color: #2563eb;

            font-size: 12px;

            font-weight: 700;

            letter-spacing: 1.5px;

            text-transform: uppercase;
        }


        h1 {

            margin-top: 7px;

            margin-bottom: 8px;

            font-size: 30px;

            font-weight: 700;
        }


        .description {

            color: #718096;

            font-size: 14px;

            margin-bottom: 28px;
        }


        .balance-box {

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #4f46e5
                );

            color: white;

            border-radius: 20px;

            padding: 28px;

            margin-bottom: 25px;

            box-shadow:
                0 15px 30px
                rgba(37,99,235,0.25);
        }


        .balance-label {

            font-size: 12px;

            opacity: 0.8;

            margin-bottom: 8px;
        }


        .balance-amount {

            font-size: 38px;

            font-weight: 700;

            letter-spacing: 1px;
        }


        .details {

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 15px;

            margin-bottom: 25px;
        }


        .detail-box {

            background: #f4f7fb;

            border-radius: 14px;

            padding: 16px;
        }


        .detail-label {

            color: #718096;

            font-size: 11px;

            margin-bottom: 5px;
        }


        .detail-value {

            font-size: 15px;

            font-weight: 650;

            color: #17233c;

            word-break: break-word;
        }


        .security {

            background: #fff8e7;

            border: 1px solid #f5d98b;

            border-radius: 13px;

            padding: 14px;

            color: #765b16;

            font-size: 12px;

            line-height: 1.6;

            margin-bottom: 20px;
        }


        .refresh-btn {

            width: 100%;

            border: none;

            padding: 13px;

            border-radius: 11px;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #4f46e5
                );

            color: white;

            font-weight: 600;

            cursor: pointer;

            transition: 0.25s;
        }


        .refresh-btn:hover {

            transform: translateY(-2px);

            box-shadow:
                0 10px 20px
                rgba(37,99,235,0.25);
        }


        .loading {

            text-align: center;

            color: #718096;

            padding: 15px;
        }


        @media (max-width: 500px) {

            .balance-card {

                padding: 25px;
            }


            .details {

                grid-template-columns: 1fr;
            }


            .balance-amount {

                font-size: 30px;
            }

        }

    </style>

</head>


<body>


<div class="balance-container">


    <!-- TOP BAR -->

    <div class="top-bar">

        <button class="back-btn"
                onclick="goDashboard()">

            ← Dashboard

        </button>


        <button class="logout-btn"
                onclick="logout()">

            Logout

        </button>

    </div>


    <!-- MAIN CARD -->

    <div class="balance-card">


        <div class="icon">
            💰
        </div>


        <div class="small-title">
            ACCOUNT SERVICES
        </div>


        <h1>
            Balance Enquiry
        </h1>


        <p class="description">

            View your current available
            account balance securely.

        </p>


        <!-- BALANCE -->

        <div class="balance-box">


            <div class="balance-label">
                AVAILABLE BALANCE
            </div>


            <div class="balance-amount"
                 id="balanceAmount">

                Loading...

            </div>


        </div>


        <!-- ACCOUNT DETAILS -->

        <div class="details">


            <div class="detail-box">

                <div class="detail-label">
                    CUSTOMER NAME
                </div>


                <div class="detail-value"
                     id="customerName">

                    Loading...

                </div>

            </div>


            <div class="detail-box">

                <div class="detail-label">
                    ACCOUNT ID
                </div>


                <div class="detail-value"
                     id="accountId">

                    Loading...

                </div>

            </div>


        </div>


        <!-- SECURITY -->

        <div class="security">

            🛡️ <strong>Security Reminder:</strong>

            Never share your PIN, OTP or banking
            information with anyone.

        </div>


        <!-- REFRESH -->

        <button class="refresh-btn"
                onclick="getBalance()">

            ↻ Refresh Balance

        </button>


    </div>

</div>


<script>


    /* Get account ID from login */

    let accountId =
        localStorage.getItem("accountId");


    /* If user is not logged in */

    if (!accountId) {

        window.location.href =
            "index.html";

    }


    /* Get balance */

    function getBalance() {


        document.getElementById(
            "balanceAmount"
        ).innerText =
            "Loading...";


        fetch("/balance/" + accountId)


            .then(response => {


                if (!response.ok) {

                    throw new Error(
                        "Unable to retrieve balance"
                    );

                }


                return response.json();

            })


            .then(data => {


                document.getElementById(
                    "balanceAmount"
                ).innerText =
                    "₹ " +
                    Number(data.balance)
                        .toLocaleString("en-IN", {
                            minimumFractionDigits: 2,
                            maximumFractionDigits: 2
                        });


                document.getElementById(
                    "customerName"
                ).innerText =
                    data.customerName;


                document.getElementById(
                    "accountId"
                ).innerText =
                    data.accountId;

            })


            .catch(error => {


                document.getElementById(
                    "balanceAmount"
                ).innerText =
                    "Unable to load";


                alert(error.message);

            });

    }


    /* Dashboard */

    function goDashboard() {

        window.location.href =
            "dashboard.html";

    }


    /* Logout */

    function logout() {

        localStorage.clear();

        window.location.href =
            "index.html";

    }


    /* Load balance when page opens */

    getBalance();


</script>


</body>

</html>
