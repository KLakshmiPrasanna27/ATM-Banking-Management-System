
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Change PIN - ATM Banking</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {

            min-height: 100vh;

            font-family:
                "Segoe UI",
                Arial,
                sans-serif;

            background:
                radial-gradient(
                    circle at 15% 20%,
                    rgba(236, 72, 153, 0.20),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 85% 80%,
                    rgba(139, 92, 246, 0.20),
                    transparent 30%
                ),
                #080b18;

            color: white;

            padding: 30px 20px;
        }


        /* TOP BAR */

        .top-bar {

            max-width: 850px;

            margin: auto;

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 25px;
        }


        .top-btn {

            border: none;

            padding: 11px 18px;

            border-radius: 12px;

            font-weight: 600;

            cursor: pointer;

            transition: 0.3s;
        }


        .dashboard-btn {

            background: #7c3aed;

            color: white;
        }


        .dashboard-btn:hover {

            background: #6d28d9;

            transform: translateY(-2px);
        }


        .logout-btn {

            background: #ef4444;

            color: white;
        }


        .logout-btn:hover {

            background: #dc2626;

            transform: translateY(-2px);
        }


        /* MAIN CARD */

        .pin-container {

            max-width: 850px;

            margin: auto;

            background: rgba(255,255,255,0.97);

            color: #172033;

            border-radius: 28px;

            padding: 40px;

            box-shadow:
                0 25px 60px
                rgba(0,0,0,0.40);
        }


        /* HEADING */

        .heading {

            text-align: center;

            margin-bottom: 30px;
        }


        .icon {

            width: 75px;

            height: 75px;

            margin: auto;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 50%;

            background:
                linear-gradient(
                    135deg,
                    #ec4899,
                    #8b5cf6
                );

            font-size: 35px;

            box-shadow:
                0 10px 25px
                rgba(236,72,153,0.30);
        }


        .heading h1 {

            margin-top: 18px;

            margin-bottom: 8px;

            font-size: 32px;

            font-weight: 700;

            background:
                linear-gradient(
                    90deg,
                    #ec4899,
                    #8b5cf6
                );

            -webkit-background-clip: text;

            -webkit-text-fill-color: transparent;
        }


        .heading p {

            color: #64748b;

            margin: 0;
        }


        /* ACCOUNT INFORMATION */

        .account-info {

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 15px;

            margin-bottom: 30px;
        }


        .info-box {

            background: #f8fafc;

            border: 1px solid #e2e8f0;

            border-radius: 15px;

            padding: 16px;
        }


        .info-label {

            font-size: 12px;

            color: #64748b;

            font-weight: 600;

            letter-spacing: 0.5px;
        }


        .info-value {

            margin-top: 5px;

            font-size: 17px;

            font-weight: 700;

            color: #1e293b;
        }


        /* FORM */

        .form-group {

            margin-bottom: 20px;
        }


        .form-label {

            font-weight: 600;

            margin-bottom: 8px;

            color: #334155;
        }


        .form-control {

            height: 52px;

            border-radius: 12px;

            border: 1px solid #cbd5e1;

            font-size: 16px;

            padding: 12px 15px;

            transition: 0.3s;
        }


        .form-control:focus {

            border-color: #ec4899;

            box-shadow:
                0 0 0 4px
                rgba(236,72,153,0.12);
        }


        /* CHANGE BUTTON */

        .change-btn {

            width: 100%;

            height: 52px;

            border: none;

            border-radius: 13px;

            color: white;

            font-size: 17px;

            font-weight: 700;

            background:
                linear-gradient(
                    90deg,
                    #ec4899,
                    #8b5cf6
                );

            cursor: pointer;

            transition: 0.3s;

            margin-top: 5px;
        }


        .change-btn:hover {

            transform: translateY(-2px);

            box-shadow:
                0 10px 25px
                rgba(236,72,153,0.30);
        }


        /* MESSAGE */

        .message {

            margin-top: 20px;

            padding: 13px;

            border-radius: 12px;

            text-align: center;

            font-weight: 600;

            display: none;
        }


        .success {

            display: block;

            background: #dcfce7;

            color: #166534;

            border: 1px solid #86efac;
        }


        .error {

            display: block;

            background: #fee2e2;

            color: #991b1b;

            border: 1px solid #fca5a5;
        }


        /* SECURITY BOX */

        .security-box {

            margin-top: 30px;

            padding: 18px;

            border-radius: 15px;

            background:
                linear-gradient(
                    135deg,
                    #fff1f2,
                    #faf5ff
                );

            border: 1px solid #fbcfe8;
        }


        .security-title {

            color: #be185d;

            font-weight: 700;

            margin-bottom: 8px;
        }


        .security-text {

            color: #64748b;

            font-size: 14px;

            line-height: 1.6;

            margin: 0;
        }


        /* RESPONSIVE */

        @media(max-width: 600px) {

            body {

                padding: 20px 12px;
            }


            .pin-container {

                padding: 25px 20px;

                border-radius: 22px;
            }


            .account-info {

                grid-template-columns: 1fr;
            }


            .heading h1 {

                font-size: 27px;
            }


            .top-btn {

                padding: 9px 13px;

                font-size: 13px;
            }
        }

    </style>

</head>


<body>


    <!-- TOP BAR -->

    <div class="top-bar">

        <button
            class="top-btn dashboard-btn"
            onclick="goDashboard()">

            ← Dashboard

        </button>


        <button
            class="top-btn logout-btn"
            onclick="logout()">

            Logout

        </button>

    </div>



    <!-- MAIN CONTAINER -->

    <div class="pin-container">


        <!-- HEADING -->

        <div class="heading">

            <div class="icon">

                🔐

            </div>


            <h1>
                Change PIN
            </h1>


            <p>
                Secure your account with a new PIN
            </p>

        </div>



        <!-- ACCOUNT INFORMATION -->

        <div class="account-info">


            <div class="info-box">

                <div class="info-label">

                    CUSTOMER NAME

                </div>


                <div
                    class="info-value"
                    id="customerName">

                </div>

            </div>



            <div class="info-box">

                <div class="info-label">

                    ACCOUNT ID

                </div>


                <div
                    class="info-value"
                    id="accountId">

                </div>

            </div>


        </div>



        <!-- OLD PIN -->

        <div class="form-group">

            <label
                for="oldPin"
                class="form-label">

                Current PIN

            </label>


            <input
                type="password"
                id="oldPin"
                class="form-control"
                maxlength="4"
                inputmode="numeric"
                placeholder="Enter your current PIN">

        </div>



        <!-- NEW PIN -->

        <div class="form-group">

            <label
                for="newPin"
                class="form-label">

                New PIN

            </label>


            <input
                type="password"
                id="newPin"
                class="form-control"
                maxlength="4"
                inputmode="numeric"
                placeholder="Enter your new PIN">

        </div>



        <!-- CONFIRM PIN -->

        <div class="form-group">

            <label
                for="confirmPin"
                class="form-label">

                Confirm New PIN

            </label>


            <input
                type="password"
                id="confirmPin"
                class="form-control"
                maxlength="4"
                inputmode="numeric"
                placeholder="Re-enter your new PIN">

        </div>



        <!-- CHANGE BUTTON -->

        <button
            class="change-btn"
            onclick="changePin()">

            🔐 Change PIN

        </button>



        <!-- MESSAGE -->

        <div
            id="message"
            class="message">

        </div>



        <!-- SECURITY -->

        <div class="security-box">

            <div class="security-title">

                🛡️ Security Reminder

            </div>


            <p class="security-text">

                Never share your ATM PIN with anyone.
                Choose a PIN that is difficult to guess.
                Do not use easily predictable numbers such as
                your date of birth or phone number.

            </p>

        </div>


    </div>



    <script>


        /* GET ACCOUNT INFORMATION */

        let accountId =
            localStorage.getItem("accountId");


        let customerName =
            localStorage.getItem("customerName");



        /* CHECK LOGIN */

        if (!accountId) {

            window.location.href =
                "index.html";
        }



        /* DISPLAY CUSTOMER */

        document.getElementById(
            "customerName"
        ).innerText =
            customerName || "Customer";


        document.getElementById(
            "accountId"
        ).innerText =
            accountId;



        /* CHANGE PIN */

        function changePin() {


            let oldPin =
                document.getElementById(
                    "oldPin"
                ).value;


            let newPin =
                document.getElementById(
                    "newPin"
                ).value;


            let confirmPin =
                document.getElementById(
                    "confirmPin"
                ).value;


            let message =
                document.getElementById(
                    "message"
                );



            /* CLEAR OLD MESSAGE */

            message.className =
                "message";

            message.innerText = "";



            /* CHECK OLD PIN */

            if (oldPin.length !== 4) {

                showError(
                    "Please enter your 4-digit current PIN."
                );

                return;
            }



            /* CHECK NEW PIN */

            if (newPin.length !== 4) {

                showError(
                    "New PIN must contain exactly 4 digits."
                );

                return;
            }



            /* CHECK ONLY NUMBERS */

            if (
                !/^\d{4}$/.test(oldPin) ||
                !/^\d{4}$/.test(newPin)
            ) {

                showError(
                    "PIN must contain only numbers."
                );

                return;
            }



            /* CONFIRM NEW PIN */

            if (newPin !== confirmPin) {

                showError(
                    "New PIN and Confirm PIN do not match."
                );

                return;
            }



            /* OLD AND NEW PIN SAME */

            if (oldPin === newPin) {

                showError(
                    "New PIN must be different from your current PIN."
                );

                return;
            }



            /* API CALL */

            fetch("/change-pin", {

                method: "POST",

                headers: {

                    "Content-Type":
                        "application/json"

                },

                body: JSON.stringify({

                    accountId:
                        Number(accountId),

                    oldPin:
                        oldPin,

                    newPin:
                        newPin

                })

            })


            .then(response => {


                if (!response.ok) {

                    return response.json()
                        .then(data => {

                            throw new Error(
                                data.message ||
                                "Unable to change PIN"
                            );

                        });

                }


                return response.text();

            })


            .then(data => {


                showSuccess(
                    "PIN changed successfully! Please use your new PIN the next time you log in."
                );


                /* CLEAR INPUTS */

                document.getElementById(
                    "oldPin"
                ).value = "";


                document.getElementById(
                    "newPin"
                ).value = "";


                document.getElementById(
                    "confirmPin"
                ).value = "";

            })


            .catch(error => {

                showError(
                    error.message
                );

            });

        }



        /* SUCCESS MESSAGE */

        function showSuccess(text) {

            let message =
                document.getElementById(
                    "message"
                );


            message.className =
                "message success";


            message.innerText =
                "✓ " + text;

        }



        /* ERROR MESSAGE */

        function showError(text) {

            let message =
                document.getElementById(
                    "message"
                );


            message.className =
                "message error";


            message.innerText =
                "⚠ " + text;

        }



        /* DASHBOARD */

        function goDashboard() {

            window.location.href =
                "dashboard.html";

        }



        /* LOGOUT */

        function logout() {

            localStorage.clear();

            window.location.href =
                "index.html";

        }

    </script>


</body>

</html>
