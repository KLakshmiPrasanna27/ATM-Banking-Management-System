<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Forgot PIN - ATM Banking</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background:
                linear-gradient(
                    135deg,
                    #0f172a,
                    #1e3a8a,
                    #2563eb
                );

            padding: 25px;
        }

        .container {
            width: 100%;
            max-width: 500px;

            background: rgba(255, 255, 255, 0.12);

            backdrop-filter: blur(15px);

            border: 1px solid rgba(255, 255, 255, 0.2);

            border-radius: 20px;

            padding: 35px;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.3);

            color: white;
        }

        .icon {
            text-align: center;

            font-size: 45px;

            margin-bottom: 10px;
        }

        h1 {
            text-align: center;

            font-size: 28px;

            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;

            color: #dbeafe;

            font-size: 14px;

            margin-bottom: 28px;
        }

        .step {
            margin-bottom: 20px;
        }

        label {
            display: block;

            margin-bottom: 7px;

            font-size: 14px;

            font-weight: bold;
        }

        input {
            width: 100%;

            padding: 12px 14px;

            border: none;

            border-radius: 10px;

            outline: none;

            font-size: 14px;

            background: rgba(255, 255, 255, 0.95);

            color: #111827;
        }

        input:focus {
            box-shadow:
                0 0 0 3px rgba(147, 197, 253, 0.5);
        }

        button {
            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 10px;

            background: white;

            color: #1e3a8a;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-2px);

            box-shadow:
                0 8px 20px rgba(0, 0, 0, 0.25);
        }

        .question-box {
            padding: 15px;

            margin-bottom: 18px;

            border-radius: 10px;

            background: rgba(255, 255, 255, 0.10);

            color: #dbeafe;

            line-height: 1.5;
        }

        .question-text {
            display: block;

            margin-top: 10px;

            color: white;

            font-size: 15px;

            font-weight: 600;
        }

        .hidden {
            display: none;
        }

        .message {
            text-align: center;

            margin-top: 15px;

            font-size: 14px;

            font-weight: bold;

            line-height: 1.5;
        }

        .login-link {
            text-align: center;

            margin-top: 20px;

            font-size: 14px;
        }

        .login-link a {
            color: #bfdbfe;

            font-weight: bold;

            text-decoration: none;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .security-note {
            margin-top: 20px;

            padding: 12px;

            border-radius: 10px;

            background: rgba(255, 255, 255, 0.08);

            color: #dbeafe;

            font-size: 12px;

            line-height: 1.5;

            text-align: center;
        }

        .copyright {
            text-align: center;

            margin-top: 20px;

            color: #94a3b8;

            font-size: 12px;
        }

        @media (max-width: 600px) {

            body {
                padding: 15px;
            }

            .container {
                padding: 25px;
            }

            h1 {
                font-size: 24px;
            }

        }

    </style>

</head>


<body>

<div class="container">

    <div class="icon">
        🔐
    </div>

    <h1>
        Forgot PIN?
    </h1>

    <p class="subtitle">
        Securely reset your ATM PIN
    </p>


    <!-- STEP 1 -->

    <div id="step1">

        <div class="step">

            <label for="cardNumber">
                Card Number
            </label>

            <input
                type="text"
                id="cardNumber"
                placeholder="Enter 16-digit card number"
                maxlength="16"
            >

        </div>

        <button onclick="getSecurityQuestion()">
            Continue
        </button>

    </div>


    <!-- STEP 2 -->

    <div id="step2" class="hidden">

        <div class="question-box">

            <strong>
                Security Question
            </strong>

            <span
                id="securityQuestion"
                class="question-text">
            </span>

        </div>


        <div class="step">

            <label for="securityAnswer">
                Your Answer
            </label>

            <input
                type="text"
                id="securityAnswer"
                placeholder="Enter your answer"
            >

        </div>


        <button onclick="verifyAnswer()">
            Verify Answer
        </button>

    </div>


    <!-- STEP 3 -->

    <div id="step3" class="hidden">

        <div class="step">

            <label for="newPin">
                New PIN
            </label>

            <input
                type="password"
                id="newPin"
                placeholder="Enter new 4-digit PIN"
                maxlength="4"
            >

        </div>


        <div class="step">

            <label for="confirmPin">
                Confirm New PIN
            </label>

            <input
                type="password"
                id="confirmPin"
                placeholder="Re-enter new PIN"
                maxlength="4"
            >

        </div>


        <button onclick="resetPin()">
            Reset PIN
        </button>

    </div>


    <div id="message" class="message"></div>


    <div class="login-link">

        Remember your PIN?

        <a href="login.html">
            Back to Login
        </a>

    </div>


    <div class="security-note">

        🔒 Never share your PIN or security answer
        with anyone.

    </div>


    <div class="copyright">

        © 2026 ATM Banking Management System.
        All Rights Reserved.

    </div>

</div>


<script>

let cardNumber = "";


/*
 * STEP 1
 * Get security question
 */

async function getSecurityQuestion() {

    const enteredCardNumber =
        document
        .getElementById("cardNumber")
        .value
        .trim();


    const message =
        document.getElementById("message");


    message.innerText = "";


    // Validate card number

    if (!/^[0-9]{16}$/.test(enteredCardNumber)) {

        message.innerText =
            "Please enter a valid 16-digit card number.";

        message.style.color =
            "#fecaca";

        return;
    }


    try {

        const response =
            await fetch(
                "/forgot-pin/question/"
                + enteredCardNumber
            );


        if (!response.ok) {

            let errorMessage =
                "Card number not found.";

            try {

                const errorData =
                    await response.json();

                if (errorData.message) {
                    errorMessage =
                        errorData.message;
                }

            } catch (error) {
                // Ignore JSON parsing error
            }


            message.innerText =
                errorMessage;

            message.style.color =
                "#fecaca";

            return;
        }


        const data =
            await response.json();


        /*
         * Store the card number
         */

        cardNumber =
            enteredCardNumber;


        /*
         * IMPORTANT:
         *
         * The security question comes
         * directly from the backend.
         *
         * Nothing is hard-coded here.
         */

        document
            .getElementById("securityQuestion")
            .innerText =
            data.securityQuestion;


        /*
         * Hide Step 1
         */

        document
            .getElementById("step1")
            .classList
            .add("hidden");


        /*
         * Show Step 2
         */

        document
            .getElementById("step2")
            .classList
            .remove("hidden");


        message.innerText =
            "Please answer your security question.";

        message.style.color =
            "#bfdbfe";

    }


    catch (error) {

        message.innerText =
            "Unable to connect to the server.";

        message.style.color =
            "#fecaca";
    }

}


/*
 * STEP 2
 * Verify security answer
 */

async function verifyAnswer() {

    const securityAnswer =
        document
        .getElementById("securityAnswer")
        .value
        .trim();


    const message =
        document.getElementById("message");


    message.innerText = "";


    if (securityAnswer === "") {

        message.innerText =
            "Please enter your security answer.";

        message.style.color =
            "#fecaca";

        return;
    }


    try {

        const response =
            await fetch(
                "/forgot-pin/verify-answer",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        cardNumber:
                            cardNumber,

                        securityAnswer:
                            securityAnswer

                    })
                }
            );


        const verified =
            await response.json();


        if (verified === true) {


            /*
             * Hide Step 2
             */

            document
                .getElementById("step2")
                .classList
                .add("hidden");


            /*
             * Show Step 3
             */

            document
                .getElementById("step3")
                .classList
                .remove("hidden");


            message.innerText =
                "Answer verified. You can now create a new PIN.";

            message.style.color =
                "#86efac";

        }


        else {

            message.innerText =
                "Incorrect security answer.";

            message.style.color =
                "#fecaca";
        }

    }


    catch (error) {

        message.innerText =
            "Unable to connect to the server.";

        message.style.color =
            "#fecaca";
    }

}


/*
 * STEP 3
 * Reset PIN
 */

async function resetPin() {

    const newPin =
        document
        .getElementById("newPin")
        .value
        .trim();


    const confirmPin =
        document
        .getElementById("confirmPin")
        .value
        .trim();


    const message =
        document.getElementById("message");


    message.innerText = "";


    // Validate new PIN

    if (!/^[0-9]{4}$/.test(newPin)) {

        message.innerText =
            "New PIN must contain exactly 4 digits.";

        message.style.color =
            "#fecaca";

        return;
    }


    // Confirm PIN

    if (newPin !== confirmPin) {

        message.innerText =
            "New PIN and Confirm PIN do not match.";

        message.style.color =
            "#fecaca";

        return;
    }


    try {

        const response =
            await fetch(
                "/forgot-pin/reset",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        cardNumber:
                            cardNumber,

                        newPin:
                            newPin,

                        confirmPin:
                            confirmPin

                    })
                }
            );


        if (!response.ok) {

            const errorText =
                await response.text();


            message.innerText =
                errorText ||
                "Unable to reset PIN.";

            message.style.color =
                "#fecaca";

            return;
        }


        const result =
            await response.text();


        message.innerText =
            result +
            ". Redirecting to login...";

        message.style.color =
            "#86efac";


        setTimeout(function() {

            window.location.href =
                "login.html";

        }, 2000);

    }


    catch (error) {

        message.innerText =
            "Unable to connect to the server.";

        message.style.color =
            "#fecaca";
    }

}

</script>


</body>

</html>
