<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Account - ATM Banking</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }


        body {

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background:
                linear-gradient(
                    135deg,
                    #0f172a,
                    #1e3a8a,
                    #2563eb
                );

            padding: 30px;
        }


        .container {

            width: 100%;
            max-width: 500px;

            background: rgba(255, 255, 255, 0.12);

            backdrop-filter: blur(15px);

            border: 1px solid rgba(255, 255, 255, 0.2);

            border-radius: 20px;

            padding: 35px;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.3);

            color: white;
        }


        .icon {

            text-align: center;

            font-size: 45px;

            margin-bottom: 10px;
        }


        h1 {

            text-align: center;

            font-size: 28px;

            margin-bottom: 8px;
        }


        .subtitle {

            text-align: center;

            color: #dbeafe;

            font-size: 14px;

            margin-bottom: 28px;
        }


        .form-group {

            margin-bottom: 18px;
        }


        label {

            display: block;

            margin-bottom: 7px;

            font-size: 14px;

            font-weight: bold;
        }


        input,
        select {

            width: 100%;

            padding: 12px 14px;

            border: none;

            border-radius: 10px;

            outline: none;

            font-size: 14px;

            background: rgba(255, 255, 255, 0.95);

            color: #111827;
        }


        input:focus,
        select:focus {

            box-shadow:
                0 0 0 3px rgba(147, 197, 253, 0.5);
        }


        .button {

            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 10px;

            background: #ffffff;

            color: #1e3a8a;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            margin-top: 8px;

            transition: 0.3s;
        }


        .button:hover {

            transform: translateY(-2px);

            box-shadow:
                0 8px 20px rgba(0, 0, 0, 0.25);
        }


        .message {

            text-align: center;

            margin-top: 15px;

            font-size: 14px;

            font-weight: bold;
        }


        .login-link {

            text-align: center;

            margin-top: 20px;

            font-size: 14px;
        }


        .login-link a {

            color: #bfdbfe;

            font-weight: bold;

            text-decoration: none;
        }


        .login-link a:hover {

            text-decoration: underline;
        }


        .security-note {

            margin-top: 20px;

            padding: 12px;

            border-radius: 10px;

            background: rgba(255, 255, 255, 0.08);

            color: #dbeafe;

            font-size: 12px;

            line-height: 1.5;

            text-align: center;
        }


        .copyright {

            text-align: center;

            margin-top: 20px;

            color: #94a3b8;

            font-size: 12px;
        }


        @media (max-width: 600px) {

            body {
                padding: 15px;
            }

            .container {
                padding: 25px;
            }

            h1 {
                font-size: 24px;
            }
        }

    </style>

</head>


<body>


<div class="container">


    <div class="icon">
        🏦
    </div>


    <h1>
        Create Account
    </h1>


    <p class="subtitle">
        Register for your secure ATM banking account
    </p>


    <form id="registerForm">


        <!-- Customer Name -->

        <div class="form-group">

            <label>
                Customer Name
            </label>

            <input
                type="text"
                id="customerName"
                placeholder="Enter your full name"
                required
            >

        </div>


        <!-- Card Number -->

        <div class="form-group">

            <label>
                Card Number
            </label>

            <input
                type="text"
                id="cardNumber"
                placeholder="Enter 16-digit card number"
                maxlength="16"
                required
            >

        </div>


        <!-- Create PIN -->

        <div class="form-group">

            <label>
                Create PIN
            </label>

            <input
                type="password"
                id="pin"
                placeholder="Enter 4-digit PIN"
                maxlength="4"
                required
            >

        </div>


        <!-- Confirm PIN -->

        <div class="form-group">

            <label>
                Confirm PIN
            </label>

            <input
                type="password"
                id="confirmPin"
                placeholder="Re-enter your PIN"
                maxlength="4"
                required
            >

        </div>


        <!-- Initial Deposit -->

        <div class="form-group">

            <label>
                Initial Deposit
            </label>

            <input
                type="number"
                id="initialDeposit"
                placeholder="Minimum ₹500"
                min="500"
                required
            >

        </div>


        <!-- Security Question -->

        <div class="form-group">

            <label>
                Security Question
            </label>

            <select
                id="securityQuestion"
                required
            >

                <option value="">
                    Select a security question
                </option>

                <option value="What is your favorite color?">
                    What is your favorite color?
                </option>

                <option value="What is your favorite food?">
                    What is your favorite food?
                </option>

                <option value="What is your favorite place?">
                    What is your favorite place?
                </option>

                <option value="What is your childhood nickname?">
                    What is your childhood nickname?
                </option>

            </select>

        </div>


        <!-- Security Answer -->

        <div class="form-group">

            <label>
                Security Answer
            </label>

            <input
                type="text"
                id="securityAnswer"
                placeholder="Enter your answer"
                required
            >

        </div>


        <button
            type="submit"
            class="button">

            Create Account

        </button>


    </form>


    <div
        id="message"
        class="message">
    </div>


    <div class="login-link">

        Already have an account?

        <a href="login.html">
            Login here
        </a>

    </div>


    <div class="security-note">

        🔐 Keep your PIN and security answer private.
        <br>
        Do not share them with anyone.

    </div>


    <div class="copyright">

        © 2026 ATM Banking Management System. All Rights Reserved.

    </div>


</div>


<script>

document
    .getElementById("registerForm")
    .addEventListener("submit", async function(event) {

        event.preventDefault();


        const customerName =
            document.getElementById("customerName").value.trim();


        const cardNumber =
            document.getElementById("cardNumber").value.trim();


        const pin =
            document.getElementById("pin").value.trim();


        const confirmPin =
            document.getElementById("confirmPin").value.trim();


        const initialDeposit =
            Number(
                document.getElementById("initialDeposit").value
            );


        const securityQuestion =
            document.getElementById("securityQuestion").value;


        const securityAnswer =
            document.getElementById("securityAnswer").value.trim();


        const message =
            document.getElementById("message");


        message.innerText = "";


        // Card number validation

        if (!/^[0-9]{16}$/.test(cardNumber)) {

            message.innerText =
                "Card number must contain exactly 16 digits.";

            return;
        }


        // PIN validation

        if (!/^[0-9]{4}$/.test(pin)) {

            message.innerText =
                "PIN must contain exactly 4 digits.";

            return;
        }


        // Confirm PIN validation

        if (pin !== confirmPin) {

            message.innerText =
                "PIN and Confirm PIN do not match.";

            return;
        }


        // Initial deposit validation

        if (initialDeposit < 500) {

            message.innerText =
                "Minimum initial deposit is ₹500.";

            return;
        }


        // Security answer validation

        if (securityAnswer === "") {

            message.innerText =
                "Security answer is required.";

            return;
        }


        try {

            const response =
                await fetch("/register", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({

                        customerName: customerName,

                        cardNumber: cardNumber,

                        pin: pin,

                        confirmPin: confirmPin,

                        initialDeposit: initialDeposit,

                        securityQuestion: securityQuestion,

                        securityAnswer: securityAnswer

                    })

                });


            const data =
                await response.json();


            if (response.ok) {

                message.innerText =
                    "Account created successfully! Redirecting to login...";


                message.style.color =
                    "#86efac";


                setTimeout(function() {

                    window.location.href =
                        "login.html";

                }, 2000);

            } else {

                message.innerText =
                    data.message ||
                    "Registration failed.";

                message.style.color =
                    "#fecaca";
            }


        } catch (error) {

            message.innerText =
                "Unable to connect to the server.";

            message.style.color =
                "#fecaca";
        }

    });

</script>


</body>

</html>
